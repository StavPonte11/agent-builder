[project]
name = "evaluator"
version = "0.1.0"
description = "Blueprint performance and token evaluation integrated with Langfuse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langfuse>=2.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluator"]
