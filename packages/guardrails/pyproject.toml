[project]
name = "guardrails"
version = "0.1.0"
description = "Safety and PII redaction pipeline for workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "presidio-analyzer>=2.2.35",
    "presidio-anonymizer>=2.2.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrails"]
