services:
  api:
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "2"
          memory: 2G
    build:
      target: production
    command: ["uv", "run", "gunicorn", "app.main:app", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000"]
    volumes: []
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  temporal-worker:
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    build:
      target: production
    volumes: []
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  celery-worker:
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    build:
      target: production
    command: ["uv", "run", "celery", "-A", "app.celery_app", "worker", "--loglevel=warning", "-Q", "default,webhooks,cache,reports", "--concurrency=8"]
    volumes: []
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  ui:
    build:
      context: ..
      dockerfile: apps/agent-builder-ui/Dockerfile
      target: production
    volumes: []
    environment:
      NODE_ENV: production
