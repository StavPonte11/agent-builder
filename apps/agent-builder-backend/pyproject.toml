[project]
name = "agent-builder-backend"
version = "0.1.0"
description = "Agent Builder Platform — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Redis
    "redis[hiredis]>=5.0.0",

    # Celery
    "celery[redis]>=5.4.0",
    "flower>=2.0.0",

    # Temporal
    "temporalio>=1.7.0",

    # AI / LangGraph
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "openai>=1.35.0",
    "anthropic>=0.30.0",
    "tiktoken>=0.7.0",

    # Observability
    "langfuse>=2.36.0",
    "prometheus-client>=0.20.0",

    # Safety
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",

    # Code execution sandbox
    "RestrictedPython>=7.2",

    # Utilities
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "orjson>=3.10.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.2.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
