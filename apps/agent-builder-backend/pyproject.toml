[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core Framework (Modern FastAPI/Pydantic)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # LangChain & LangGraph (Post-1.0 Production Stable)
    "langchain>=1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    # Observability
    "langfuse>=2.50.0",
    # Database (SQLAlchemy 2.x & Modern Drivers)
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.30.0",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.10",
    # Cache & Memory (Unified Async Support)
    "redis>=5.2.0",
    # Security & Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    # Utilities
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    # Content Safety & Guardrails
    "openai>=1.50.0",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    # Monitoring
    "prometheus-client>=0.21.0",
    "structlog>=25.1.0",
    # Task Queue
    "celery>=5.6.2",
    "kombu>=5.6.0",
    # Rate Limiting & Validation
    "slowapi>=0.1.9",
    "jsonschema>=4.23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]
